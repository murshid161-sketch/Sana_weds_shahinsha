<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard · Sana & Shahinsha</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a0508;--ink2:#2d0814;--gold:#b08d5b;--gold-hi:#f3dfa1;
  --ivory:#f5efe3;--line:rgba(176,141,91,.2);--red:#7b1a1a;
}
body{background:var(--ink);color:var(--ivory);font-family:'Georgia',serif;min-height:100vh;}
/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.login-box{width:min(100%,380px);text-align:center;}
.login-mono{font-family:monospace;font-size:2.8rem;color:var(--gold);letter-spacing:.1em;margin-bottom:.3rem;}
.login-title{font-style:italic;font-size:1.1rem;color:var(--ivory);opacity:.7;margin-bottom:2.5rem;}
.login-box input{width:100%;padding:14px 18px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ivory);font-size:1rem;border-radius:8px;margin-bottom:1rem;outline:none;letter-spacing:.1em;text-align:center;}
.login-box input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:14px;background:var(--gold);color:var(--ink);font-family:monospace;letter-spacing:.3em;font-size:.7rem;border:none;border-radius:8px;cursor:pointer;}
.login-err{color:#e57373;font-size:.75rem;margin-top:.5rem;min-height:1.2em;letter-spacing:.05em;}
/* DASHBOARD */
#dashboard{display:none;padding:2rem 1.2rem 4rem;max-width:700px;margin:0 auto;}
.db-header{text-align:center;padding:2rem 0 1.5rem;}
.db-mono{font-family:monospace;font-size:1.6rem;color:var(--gold);letter-spacing:.12em;}
.db-sub{font-style:italic;color:var(--ivory);opacity:.5;font-size:.85rem;margin-top:.3rem;}
.db-rule{height:1px;background:var(--line);margin:1.5rem 0;}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:2rem;}
.stat{background:rgba(176,141,91,.07);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1rem;text-align:center;}
.stat-n{font-size:2.2rem;color:var(--gold-hi);font-style:italic;}
.stat-l{font-family:monospace;font-size:.5rem;letter-spacing:.2em;color:var(--gold);opacity:.7;margin-top:.3rem;}
/* SECTION */
.section{margin-bottom:2rem;}
.section-title{font-family:monospace;letter-spacing:.2em;font-size:.6rem;color:var(--gold);opacity:.7;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line);}
/* LINK GEN */
.link-gen{display:flex;gap:.6rem;margin-bottom:.8rem;}
.link-gen input{flex:1;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ivory);font-size:.9rem;border-radius:8px;outline:none;}
.link-gen input:focus{border-color:var(--gold);}
.link-gen button{padding:12px 16px;background:var(--gold);color:var(--ink);border:none;border-radius:8px;font-family:monospace;font-size:.55rem;letter-spacing:.15em;cursor:pointer;white-space:nowrap;}
.link-output{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.75rem;color:var(--gold-hi);word-break:break-all;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s;}
.link-output:hover{border-color:var(--gold);}
.link-output .copy-hint{font-family:monospace;font-size:.5rem;letter-spacing:.15em;color:var(--gold);opacity:.6;white-space:nowrap;margin-left:auto;}
.link-wa{display:flex;gap:.6rem;margin-top:.6rem;}
.link-wa button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:8px;font-family:monospace;font-size:.5rem;letter-spacing:.15em;cursor:pointer;}
.link-wa .wa{background:#25d366;border-color:#25d366;color:#fff;}
/* RSVP LIST */
.rsvp-list{display:flex;flex-direction:column;gap:.6rem;max-height:500px;overflow-y:auto;}
.rsvp-card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.rsvp-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--ivory);flex-shrink:0;font-style:italic;}
.rsvp-name{font-style:italic;font-size:.95rem;color:var(--ivory);}
.rsvp-meta{font-family:monospace;font-size:.5rem;letter-spacing:.1em;color:var(--gold);opacity:.6;margin-top:.2rem;}
.rsvp-badge{margin-left:auto;padding:4px 10px;border-radius:999px;font-family:monospace;font-size:.48rem;letter-spacing:.15em;flex-shrink:0;}
.del-btn{background:none;border:none;color:rgba(176,141,91,.3);cursor:pointer;font-size:1rem;padding:4px;margin-left:6px;flex-shrink:0;}
.del-btn:hover{color:#e57373;}
.badge-yes{background:rgba(100,200,100,.15);color:#7dcf7d;border:1px solid rgba(100,200,100,.2);}
.badge-no{background:rgba(200,100,100,.1);color:#e57373;border:1px solid rgba(200,100,100,.15);}
.empty-state{text-align:center;padding:2rem;color:var(--gold);opacity:.4;font-style:italic;font-size:.9rem;}
/* EXPORT */
.export-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:8px;font-family:monospace;letter-spacing:.2em;font-size:.55rem;cursor:pointer;margin-top:.8rem;}
.export-btn:hover{border-color:var(--gold);}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink2);color:var(--gold-hi);padding:10px 18px;border-radius:999px;font-family:monospace;font-size:.55rem;letter-spacing:.15em;opacity:0;transition:all .3s;z-index:9999;border:1px solid var(--line);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* LOGOUT */
.logout-btn{display:block;margin:0 auto;padding:10px 24px;background:transparent;border:1px solid rgba(176,141,91,.15);color:rgba(176,141,91,.35);font-family:monospace;font-size:.48rem;letter-spacing:.2em;cursor:pointer;border-radius:8px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-mono">S & S</div>
    <div class="login-title">Sana & Shahinsha · Dashboard</div>
    <input type="password" id="pwInput" placeholder="ENTER PASSWORD" onkeydown="if(event.key==='Enter')tryLogin()"/>
    <button class="login-btn" onclick="tryLogin()">ENTER ✦</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="db-header">
    <div class="db-mono">S & S</div>
    <div class="db-sub">Sana & Shahinsha · Wedding Dashboard</div>
  </div>
  <div class="db-rule"></div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat"><div class="stat-n" id="statTotal">0</div><div class="stat-l">TOTAL RSVPs</div></div>
    <div class="stat"><div class="stat-n" id="statAttending">0</div><div class="stat-l">ATTENDING</div></div>
    <div class="stat"><div class="stat-n" id="statGuests">0</div><div class="stat-l">TOTAL GUESTS</div></div>
    <div class="stat"><div class="stat-n" id="statRegrets">0</div><div class="stat-l">REGRETS</div></div>
  </div>

  <!-- PERSONALISED LINK -->
  <div class="section">
    <div class="section-title">PERSONALISED LINK GENERATOR</div>
    <div class="link-gen">
      <input type="text" id="guestNameInput" placeholder="Guest name e.g. Ahmad Ali"/>
      <button onclick="genLink()">GENERATE</button>
    </div>
    <div class="link-output" id="linkOutput" onclick="copyLink()" style="display:none">
      <span id="linkText"></span>
      <span class="copy-hint">TAP TO COPY</span>
    </div>
    <div class="link-wa" id="linkActions" style="display:none">
      <button onclick="copyLink()">COPY LINK</button>
      <button class="wa" onclick="shareWa()">SHARE ON WHATSAPP</button>
    </div>
  </div>

  <!-- RSVP LIST -->
  <div class="section">
    <div class="section-title">RSVP RESPONSES</div>
    <div class="rsvp-list" id="rsvpList"><div class="empty-state">Loading...</div></div>
    <button class="export-btn" onclick="exportCSV()">EXPORT AS CSV ↓</button>
  </div>

  <button class="logout-btn" onclick="logout()">LOG OUT</button>
</div>

<div class="toast" id="toast"></div>

<script>
const PASSWORD  = 'sanashahinsha2026';
const BASE_URL  = 'https://murshid161-sketch.github.io/Sana_weds_shahinsha/';
const RSVP_PATH = 'sana-shahinsha/rsvp';

// Firebase
const cfg = {
  apiKey:"AIzaSy841fvxVl1KeHOro6WKJ72o22izuCpJ-b4",
  authDomain:"yaseen-jumana-wedding.firebaseapp.com",
  databaseURL:"https://yaseen-jumana-wedding-default-rtdb.firebaseio.com",
  projectId:"yaseen-jumana-wedding",
  storageBucket:"yaseen-jumana-wedding.firebasestorage.app",
  messagingSenderId:"355557621111",
  appId:"1:355557621111:web:d0b78c34bfe5a53b69f572"
};
if(!firebase.apps.length) firebase.initializeApp(cfg);
const db = firebase.database();

let _allRsvps = [];
let _generatedLink = '';

// ── AUTH ──
function tryLogin(){
  const pw = document.getElementById('pwInput').value;
  if(pw === PASSWORD){ showDashboard(); }
  else{ document.getElementById('loginErr').textContent = 'Incorrect password'; }
}

function showDashboard(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadRsvps();
}

function logout(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pwInput').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ── RSVP ──
function loadRsvps(){
  db.ref(RSVP_PATH).on('value', snap => {
    _allRsvps = [];
    if(snap.exists()){
      snap.forEach(child => _allRsvps.push({key:child.key,...child.val()}));
      _allRsvps.sort((a,b) => (b.ts||0) - (a.ts||0));
    }
    renderStats();
    renderList(_allRsvps);
  });
}

function renderStats(){
  const total    = _allRsvps.length;
  const attending= _allRsvps.filter(r=>r.attending).length;
  const guests   = _allRsvps.filter(r=>r.attending).reduce((s,r)=>s+(r.members||1),0);
  const regrets  = _allRsvps.filter(r=>!r.attending).length;
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statAttending').textContent= attending;
  document.getElementById('statGuests').textContent   = guests;
  document.getElementById('statRegrets').textContent  = regrets;
}

function renderList(list){
  const el = document.getElementById('rsvpList');
  if(!list.length){ el.innerHTML='<div class="empty-state">No RSVPs yet</div>'; return; }
  el.innerHTML = list.map(r => `
    <div class="rsvp-card">
      <div class="rsvp-avatar">${(r.name||'?')[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="rsvp-name">${esc(r.name||'—')}</div>
        <div class="rsvp-meta">${r.attending ? (r.members||1)+' guest'+(r.members>1?'s':'') : 'Not attending'} · ${esc(r.time||'')}</div>
      </div>
      <div class="rsvp-badge ${r.attending?'badge-yes':'badge-no'}">${r.attending?'ATTENDING':'REGRETS'}</div>
      <button class="del-btn" onclick="deleteRsvp('${r.key}')" title="Delete">✕</button>
    </div>`).join('');
}

// ── LINK GENERATOR ──
function genLink(){
  const name = document.getElementById('guestNameInput').value.trim();
  if(!name){ showToast('Enter a guest name'); return; }
  _generatedLink = BASE_URL + '?guest=' + encodeURIComponent(name);
  document.getElementById('linkText').textContent = _generatedLink;
  document.getElementById('linkOutput').style.display = 'flex';
  document.getElementById('linkActions').style.display = 'flex';
}

function copyLink(){
  if(!_generatedLink) return;
  navigator.clipboard.writeText(_generatedLink).then(()=>showToast('COPIED ✦')).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = _generatedLink; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('COPIED ✦');
  });
}

function shareWa(){
  if(!_generatedLink) return;
  const name = document.getElementById('guestNameInput').value.trim();
  const msg  = encodeURIComponent('Dear ' + name + ', you are cordially invited to the wedding of Sana & Shahinsha. Open your personalised invitation: ' + _generatedLink);
  window.open('https://wa.me/?text=' + msg, '_blank');
}

// ── DELETE RSVP ──
function deleteRsvp(key){
  if(!confirm('Delete this RSVP?')) return;
  db.ref(RSVP_PATH + '/' + key).remove()
    .then(()=>showToast('DELETED ✦'))
    .catch(()=>showToast('ERROR'));
}

// ── EXPORT ──
function exportCSV(){
  if(!_allRsvps.length){ showToast('No data to export'); return; }
  const rows = [['Name','Attending','Guests','Time']];
  _allRsvps.forEach(r => rows.push([r.name||'', r.attending?'Yes':'No', r.members||1, r.time||'']));
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'sana-shahinsha-rsvp.csv'; a.click();
}

// ── UTILS ──
function esc(s){ const d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
function showToast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
